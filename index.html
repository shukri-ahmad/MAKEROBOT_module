<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Tutorial Library</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 2rem; }
    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    .card { background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
    .btn { display: inline-block; margin-top: 1rem; background: #1a73e8; color: #fff; padding: 0.5rem 1rem; text-decoration: none; border-radius: 4px; }
    .loading { text-align: center; font-size: 1.2rem; color: #666; }
  </style>
</head>
<body>

  <h1>📚 Tutorial Library</h1>
  <div id="status" class="loading">Fetching latest tutorials from Google Drive...</div>
  <div class="catalog" id="catalog-container"></div>

  <script>
    // Updated Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbw1WiqEpzwqONQmFxkxYwpNDQ7XF7b0gcFOQa39goXB8d4OGZvgjbVF2oiVDODg1yBF/exec";

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').style.display = 'none';
        const container = document.getElementById('catalog-container');

        // Store tutorial image data in browser session memory
        sessionStorage.setItem('tutorials_data', JSON.stringify(data));

        data.forEach((tutorial, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${tutorial.coverUrl}" alt="${tutorial.title}">
            <h3>${tutorial.title}</h3>
            <a class="btn" href="viewer.html?id=${index}">Open Interactive Book (${tutorial.pages.length} Pages)</a>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Failed to load tutorials. Make sure Google Apps Script is deployed with access set to "Anyone".';
      });
  </script>

</body>
</html>
