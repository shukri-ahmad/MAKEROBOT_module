<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>MAKEROBOT MODULE READER</title>
  <!-- Page Flip JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    header {
      height: 60px;
      padding: 0 15px;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #d92525;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      background: #374151;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    header a:hover {
      background: #4b5563;
    }

    #title {
      font-size: 1rem;
      font-weight: bold;
      color: #f3f4f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40vw;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #page-counter {
      color: #9ca3af;
      font-size: 0.85rem;
    }

    .fullscreen-btn {
      background: #374151;
      color: white;
      border: 1px solid #4b5563;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .fullscreen-btn:hover {
      background: #4b5563;
    }

    .book-stage {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1f2937 0%, #0b0f19 100%);
      overflow: hidden;
      position: relative;
      cursor: default;
    }

    .book-stage.can-pan {
      cursor: grab;
    }

    .book-stage.is-panning {
      cursor: grabbing;
    }

    #zoom-wrapper {
      transition: transform 0.1s ease-out;
      transform-origin: center center;
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform;
    }

    .page-sheet {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .footer-bar {
      height: 60px;
      background: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #374151;
      z-index: 10;
      padding: 0 10px;
      flex-shrink: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: #4b5563;
      margin: 0 3px;
    }

    .nav-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #1d4ed8;
    }

    .zoom-btn {
      background: #374151;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .zoom-btn:hover {
      background: #4b5563;
    }

    #zoom-level {
      font-size: 0.8rem;
      color: #d1d5db;
      min-width: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html">← Back to Catalog</a>
      <span id="title">Loading...</span>
    </div>
    <div class="header-right">
      <span id="page-counter">Page 1</span>
      <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <div class="book-stage" id="book-stage">
    <div id="zoom-wrapper">
      <div id="book"></div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="control-group">
      <button class="nav-btn" onclick="pageFlip.flipPrev()">← Prev</button>
      <button class="nav-btn" onclick="pageFlip.flipNext()">Next →</button>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <button class="zoom-btn" onclick="changeZoom(-0.25)" title="Zoom Out">🔍 -</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" onclick="changeZoom(0.25)" title="Zoom In">🔍 +</button>
      <button class="zoom-btn" onclick="resetZoom()" title="Reset Zoom">Reset</button>
    </div>
  </div>

  <script>
    let pageFlip;
    let currentZoom = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let initialPinchDistance = null;
    let moduleMeta = { isLandscape: false, width: 3, height: 4 };

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id')) || 0;

    const data = JSON.parse(sessionStorage.getItem('tutorials_data') || '[]');
    const tutorial = data[id];

    if (tutorial && tutorial.pages.length > 0) {
      document.getElementById('title').innerText = tutorial.title;
      
      const sampleImg = new Image();
      sampleImg.src = tutorial.pages[0];

      sampleImg.onload = function() {
        moduleMeta.isLandscape = this.naturalWidth > this.naturalHeight;
        moduleMeta.width = this.naturalWidth;
        moduleMeta.height = this.naturalHeight;
        initBookViewer();
      };

      sampleImg.onerror = function() {
        initBookViewer();
      };

    } else {
      window.location.href = 'index.html';
    }

    function calculatePageDimensions() {
      const stage = document.getElementById('book-stage');
      const stageHeight = stage.clientHeight - 20; // Fit available stage height
      const stageWidth = stage.clientWidth - 20;   // Fit available stage width

      const isMobile = window.innerWidth < 768;
      let pageWidth, pageHeight;

      if (isMobile) {
        pageWidth = Math.min(stageWidth * 0.95, 480);
        pageHeight = Math.min(stageHeight * 0.95, Math.round(pageWidth * (moduleMeta.height / moduleMeta.width)));
      } else if (moduleMeta.isLandscape) {
        pageHeight = Math.min(stageHeight * 0.92, 800);
        pageWidth = Math.min(stageWidth * 0.95, Math.round(pageHeight * (moduleMeta.width / moduleMeta.height)));
      } else {
        pageHeight = Math.min(stageHeight * 0.92, 800);
        pageWidth = Math.round(pageHeight * (moduleMeta.width / moduleMeta.height));
      }

      return { pageWidth, pageHeight, isMobile };
    }

    function initBookViewer() {
      const bookContainer = document.getElementById('book');
      bookContainer.innerHTML = ''; // Clear container

      tutorial.pages.forEach((pageUrl, idx) => {
        const page = document.createElement('div');
        page.className = 'page-sheet';
        
        if (idx === 0 || idx === tutorial.pages.length - 1) {
          page.setAttribute('data-density', 'hard');
        } else {
          page.setAttribute('data-density', 'soft');
        }
        
        page.innerHTML = `<img src="${pageUrl}" alt="Page ${idx + 1}">`;
        bookContainer.appendChild(page);
      });

      const { pageWidth, pageHeight, isMobile } = calculatePageDimensions();

      pageFlip = new St.PageFlip(bookContainer, {
        width: pageWidth,
        height: pageHeight,
        size: 'fixed',
        showCover: true,         
        usePortrait: isMobile || moduleMeta.isLandscape,
        drawShadow: true,
        maxShadowOpacity: 0.6,
        mobileScrollSupport: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      pageFlip.on('flip', (e) => {
        const current = e.data + 1;
        const total = tutorial.pages.length;
        document.getElementById('page-counter').innerText = `Page ${current} of ${total}`;
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        if (e.key === 'ArrowRight') pageFlip.flipNext();
      });
    }

    // --- FULLSCREEN LOGIC ---
    function toggleFullscreen() {
      const fsBtn = document.getElementById('fullscreen-btn');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Auto resize book to fill screen when fullscreen state changes
    function updateLayoutSize() {
      const fsBtn = document.getElementById('fullscreen-btn');
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        fsBtn.innerText = 'Exit Fullscreen';
      } else {
        fsBtn.innerText = '⛶ Fullscreen';
      }

      resetZoom();

      // Recalculate dimensions for full screen fit
      if (pageFlip) {
        const { pageWidth, pageHeight } = calculatePageDimensions();
        pageFlip.updateFromHtml(document.querySelectorAll('.page-sheet'));
      }
    }

    document.addEventListener('fullscreenchange', updateLayoutSize);
    document.addEventListener('webkitfullscreenchange', updateLayoutSize);
    window.addEventListener('resize', updateLayoutSize);

    // --- ZOOM, PAN & PINCH LOGIC ---
    const stage = document.getElementById('book-stage');

    function changeZoom(amount) {
      currentZoom = Math.min(Math.max(1, currentZoom + amount), 3);
      if (currentZoom === 1) {
        panX = 0;
        panY = 0;
      }
      applyTransform();
    }

    function resetZoom() {
      currentZoom = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function applyTransform() {
      const zoomWrapper = document.getElementById('zoom-wrapper');
      const zoomText = document.getElementById('zoom-level');
      
      zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
      zoomText.innerText = `${Math.round(currentZoom * 100)}%`;

      if (currentZoom > 1) {
        stage.classList.add('can-pan');
      } else {
        stage.classList.remove('can-pan', 'is-panning');
      }
    }

    function getTouchDistance(e) {
      return Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }

    // Touch events for panning only when zoomed in
    stage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getTouchDistance(e);
      } else if (e.touches.length === 1 && currentZoom > 1) {
        // Only pan if zoomed in above 100%
        isPanning = true;
        stage.classList.add('is-panning');
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      }
    });

    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance) {
        const newDistance = getTouchDistance(e);
        const factor = newDistance / initialPinchDistance;
        currentZoom = Math.min(Math.max(1, currentZoom * (factor > 1 ? 1.03 : 0.97)), 3);
        initialPinchDistance = newDistance;
        applyTransform();
      } else if (e.touches.length === 1 && isPanning && currentZoom > 1) {
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        applyTransform();
      }
    });

    stage.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) {
        isPanning = false;
        stage.classList.remove('is-panning');
      }
    });

    // Mouse events for panning desktop
    stage.addEventListener('mousedown', (e) => {
      if (currentZoom <= 1) return; // Prevent panning at default zoom
      isPanning = true;
      stage.classList.add('is-panning');
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning || currentZoom <= 1) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      stage.classList.remove('is-panning');
    });
  </script>
</body>
</html>
