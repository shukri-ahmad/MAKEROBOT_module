<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKEROBOT MODULE READER</title>
  <!-- Page Flip JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    body {
      margin: 0;
      background: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    header {
      padding: 10px 20px;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #d92525;
      z-index: 10;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      background: #374151;
      padding: 6px 12px;
      border-radius: 4px;
    }

    header a:hover {
      background: #4b5563;
    }

    #title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f3f4f6;
    }

    #page-counter {
      color: #9ca3af;
      font-size: 0.9rem;
    }

    /* Container for the 3D Book */
    .book-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: radial-gradient(circle, #1f2937 0%, #0b0f19 100%);
    }

    /* 3D Shadows & Page Styling */
    .page-sheet {
      background-color: #fff;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Controls */
    .nav-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    .nav-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .nav-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">← Back to Catalog</a>
    <span id="title">Loading...</span>
    <span id="page-counter">Page 1</span>
  </header>

  <div class="book-stage">
    <div id="book"></div>
  </div>

  <div class="nav-controls">
    <button class="nav-btn" onclick="pageFlip.flipPrev()">← Prev Page</button>
    <button class="nav-btn" onclick="pageFlip.flipNext()">Next Page →</button>
  </div>

  <script>
    let pageFlip;

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id')) || 0;

    const data = JSON.parse(sessionStorage.getItem('tutorials_data') || '[]');
    const tutorial = data[id];

    if (tutorial) {
      document.getElementById('title').innerText = tutorial.title;
      const bookContainer = document.getElementById('book');

      // Add pages dynamically
      tutorial.pages.forEach((pageUrl, idx) => {
        const page = document.createElement('div');
        page.className = 'page-sheet';
        page.innerHTML = `<img src="${pageUrl}" alt="Page ${idx + 1}">`;
        bookContainer.appendChild(page);
      });

      // Calculate realistic page dimension responsive to screen
      const screenHeight = window.innerHeight - 140;
      const pageWidth = Math.min(screenHeight * 0.7, 550);

      // Initialize 3D PageFlip Engine
      pageFlip = new St.PageFlip(bookContainer, {
        width: pageWidth,
        height: screenHeight,
        size: 'fixed',
        minWidth: 300,
        maxWidth: 600,
        minHeight: 400,
        maxHeight: 800,
        maxShadowOpacity: 0.5, // Realistic 3D shadow gradient
        showCover: true,       // Treats page 1 as the front cover
        mobileScrollSupport: true
      });

      // Load pages from HTML elements
      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      // Update page counter on flip
      pageFlip.on('flip', (e) => {
        document.getElementById('page-counter').innerText = `Page ${e.data + 1} of ${tutorial.pages.length}`;
      });

      // Keyboard arrow controls
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        if (e.key === 'ArrowRight') pageFlip.flipNext();
      });

    } else {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
