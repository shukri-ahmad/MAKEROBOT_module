<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>MAKEROBOT MODULE READER</title>
  <!-- Page Flip JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
    }

    header {
      height: 60px;
      padding: 0 20px;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #d92525;
      z-index: 10;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      background: #374151;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    header a:hover {
      background: #4b5563;
    }

    #title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f3f4f6;
    }

    #page-counter {
      color: #9ca3af;
      font-size: 0.9rem;
    }

    .book-stage {
      height: calc(100vh - 120px);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1f2937 0%, #0b0f19 100%);
      overflow: hidden;
      position: relative;
      cursor: default;
    }

    .book-stage.can-pan {
      cursor: grab;
    }

    .book-stage.is-panning {
      cursor: grabbing;
    }

    #zoom-wrapper {
      transition: transform 0.1s ease-out;
      transform-origin: center center;
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform;
    }

    .page-sheet {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .footer-bar {
      height: 60px;
      background: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      border-top: 1px solid #374151;
      z-index: 10;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: #4b5563;
      margin: 0 5px;
    }

    .nav-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #1d4ed8;
    }

    .zoom-btn {
      background: #374151;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .zoom-btn:hover {
      background: #4b5563;
    }

    #zoom-level {
      font-size: 0.85rem;
      color: #d1d5db;
      min-width: 45px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">← Back to Catalog</a>
    <span id="title">Loading...</span>
    <span id="page-counter">Page 1</span>
  </header>

  <div class="book-stage" id="book-stage">
    <div id="zoom-wrapper">
      <div id="book"></div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="control-group">
      <button class="nav-btn" onclick="pageFlip.flipPrev()">← Previous</button>
      <button class="nav-btn" onclick="pageFlip.flipNext()">Next →</button>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <button class="zoom-btn" onclick="changeZoom(-0.25)" title="Zoom Out">🔍 -</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" onclick="changeZoom(0.25)" title="Zoom In">🔍 +</button>
      <button class="zoom-btn" onclick="resetZoom()" title="Reset Zoom">Reset</button>
    </div>
  </div>

  <script>
    let pageFlip;
    let currentZoom = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id')) || 0;

    const data = JSON.parse(sessionStorage.getItem('tutorials_data') || '[]');
    const tutorial = data[id];

    if (tutorial && tutorial.pages.length > 0) {
      document.getElementById('title').innerText = tutorial.title;
      
      // Auto-detect aspect ratio of page 1
      const sampleImg = new Image();
      sampleImg.src = tutorial.pages[0];

      sampleImg.onload = function() {
        const isLandscape = this.naturalWidth > this.naturalHeight;
        initBookViewer(isLandscape, this.naturalWidth, this.naturalHeight);
      };

      sampleImg.onerror = function() {
        // Fallback default if detection fails
        initBookViewer(false, 3, 4);
      };

    } else {
      window.location.href = 'index.html';
    }

    function initBookViewer(isLandscape, origWidth, origHeight) {
      const bookContainer = document.getElementById('book');

      tutorial.pages.forEach((pageUrl, idx) => {
        const page = document.createElement('div');
        page.className = 'page-sheet';
        
        if (idx === 0 || idx === tutorial.pages.length - 1) {
          page.setAttribute('data-density', 'hard');
        } else {
          page.setAttribute('data-density', 'soft');
        }
        
        page.innerHTML = `<img src="${pageUrl}" alt="Page ${idx + 1}">`;
        bookContainer.appendChild(page);
      });

      const stageHeight = window.innerHeight - 130;
      const stageWidth = window.innerWidth - 40;

      let pageWidth, pageHeight;

      if (isLandscape) {
        // Calculate dimensions for Landscape modules
        pageHeight = Math.min(stageHeight, 600);
        pageWidth = Math.min(stageWidth, Math.round(pageHeight * (origWidth / origHeight)));
      } else {
        // Calculate dimensions for Portrait modules
        pageHeight = Math.min(stageHeight, 700);
        pageWidth = Math.round(pageHeight * (origWidth / origHeight));
      }

      // Configure PageFlip Engine dynamically
      pageFlip = new St.PageFlip(bookContainer, {
        width: pageWidth,
        height: pageHeight,
        size: 'fixed',
        showCover: true,         
        usePortrait: isLandscape, // Use single page view for landscape slides, 2-page spread for portrait
        drawShadow: true,
        maxShadowOpacity: 0.6,
        mobileScrollSupport: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      pageFlip.on('flip', (e) => {
        const current = e.data + 1;
        const total = tutorial.pages.length;
        document.getElementById('page-counter').innerText = `Page ${current} of ${total}`;
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        if (e.key === 'ArrowRight') pageFlip.flipNext();
      });
    }

    // --- ZOOM & PAN LOGIC ---
    const stage = document.getElementById('book-stage');

    function changeZoom(amount) {
      currentZoom = Math.min(Math.max(1, currentZoom + amount), 2.5);
      if (currentZoom === 1) {
        panX = 0;
        panY = 0;
      }
      applyTransform();
    }

    function resetZoom() {
      currentZoom = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function applyTransform() {
      const zoomWrapper = document.getElementById('zoom-wrapper');
      const zoomText = document.getElementById('zoom-level');
      
      zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
      zoomText.innerText = `${Math.round(currentZoom * 100)}%`;

      if (currentZoom > 1) {
        stage.classList.add('can-pan');
      } else {
        stage.classList.remove('can-pan', 'is-panning');
      }
    }

    function startPan(e) {
      if (currentZoom <= 1) return;
      isPanning = true;
      stage.classList.add('is-panning');
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      startX = clientX - panX;
      startY = clientY - panY;
    }

    function movePan(e) {
      if (!isPanning || currentZoom <= 1) return;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      panX = clientX - startX;
      panY = clientY - startY;
      
      applyTransform();
    }

    function endPan() {
      isPanning = false;
      stage.classList.remove('is-panning');
    }

    stage.addEventListener('mousedown', startPan);
    window.addEventListener('mousemove', movePan);
    window.addEventListener('mouseup', endPan);

    stage.addEventListener('touchstart', startPan, { passive: true });
    window.addEventListener('touchmove', movePan, { passive: true });
    window.addEventListener('touchend', endPan);
  </script>
</body>
</html>
