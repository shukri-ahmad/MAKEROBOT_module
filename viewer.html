<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKEROBOT MODULE READER</title>
  <!-- Page Flip JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111827;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    header {
      height: 60px;
      padding: 0 20px;
      background: #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #d92525;
      z-index: 10;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      background: #374151;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    header a:hover {
      background: #4b5563;
    }

    #title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f3f4f6;
    }

    #page-counter {
      color: #9ca3af;
      font-size: 0.9rem;
    }

    /* Stage centered with reserved height for navigation controls */
    .book-stage {
      height: calc(100vh - 120px);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1f2937 0%, #0b0f19 100%);
      overflow: hidden;
    }

    /* Individual Page Container */
    .page-sheet {
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Fixed Bottom Control Bar */
    .footer-bar {
      height: 60px;
      background: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      border-top: 1px solid #374151;
      z-index: 10;
    }

    .nav-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">← Back to Catalog</a>
    <span id="title">Loading...</span>
    <span id="page-counter">Page 1</span>
  </header>

  <div class="book-stage">
    <div id="book"></div>
  </div>

  <div class="footer-bar">
    <button class="nav-btn" onclick="pageFlip.flipPrev()">← Previous</button>
    <button class="nav-btn" onclick="pageFlip.flipNext()">Next →</button>
  </div>

  <script>
    let pageFlip;

    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id')) || 0;

    const data = JSON.parse(sessionStorage.getItem('tutorials_data') || '[]');
    const tutorial = data[id];

    if (tutorial) {
      document.getElementById('title').innerText = tutorial.title;
      const bookContainer = document.getElementById('book');

      // Create page elements
      tutorial.pages.forEach((pageUrl, idx) => {
        const page = document.createElement('div');
        page.className = 'page-sheet';
        // Mark front cover and back cover as hard cover density
        if (idx === 0 || idx === tutorial.pages.length - 1) {
          page.setAttribute('data-density', 'hard');
        } else {
          page.setAttribute('data-density', 'soft');
        }
        page.innerHTML = `<img src="${pageUrl}" alt="Page ${idx + 1}">`;
        bookContainer.appendChild(page);
      });

      // Calculate container fit dimensions
      const stageHeight = window.innerHeight - 130;
      // Single page height and aspect ratio (A4 standard fit)
      const pageHeight = Math.min(stageHeight, 700);
      const pageWidth = Math.round(pageHeight * 0.707); 

      // Initialize 2-Page Spread Book
      pageFlip = new St.PageFlip(bookContainer, {
        width: pageWidth,
        height: pageHeight,
        size: 'fixed',
        showCover: true,         // Front cover opens independently
        usePortrait: false,       // Force 2-page side-by-side spread on desktop
        drawShadow: true,
        maxShadowOpacity: 0.6,
        mobileScrollSupport: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      // Update current displayed page range
      pageFlip.on('flip', (e) => {
        const current = e.data + 1;
        const total = tutorial.pages.length;
        document.getElementById('page-counter').innerText = `Page ${current} of ${total}`;
      });

      // Arrow Key Navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        if (e.key === 'ArrowRight') pageFlip.flipNext();
      });

    } else {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
